<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      color: #333;
      margin: 0;
      background: #fafafa;
      box-sizing: border-box;
    }
    .header {
      margin-bottom: 20px;
      text-align: center;
    }
    h2 {
      font-size: 20px;
      margin: 0 0 6px 0;
      font-weight: 600;
      color: #111;
    }
    p {
      font-size: 14px;
      color: #666;
      margin: 0;
      line-height: 1.4;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 16px;
      border: 1px solid #ebebeb;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .manual-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      height: 44px;
      padding: 0 12px;
      font-size: 15px;
      color: #222;
      border: 1.5px solid #dcdcdc;
      border-radius: 8px;
      outline: none;
      box-sizing: border-box;
    }
    input[type="text"]:focus {
      border-color: #1E88E5;
    }
    .btn-manual {
      height: 44px;
      padding: 0 16px;
      background: #1E88E5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-manual:active {
      background: #1565C0;
    }
    .device-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .device-item {
      display: flex;
      align-items: center;
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      text-align: left;
    }
    .device-item:hover, .device-item:active {
      border-color: #1E88E5;
      background: #f0f7ff;
    }
    .device-icon {
      width: 36px;
      height: 36px;
      background: #e3f2fd;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .device-icon svg {
      width: 20px;
      height: 20px;
      fill: #1976D2;
    }
    .device-info {
      flex: 1;
      min-width: 0;
    }
    .device-name {
      font-size: 15px;
      font-weight: 600;
      color: #1a202c;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .device-ip {
      font-size: 13px;
      color: #718096;
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      white-space: nowrap;
    }
    .device-arrow {
      color: #a0aec0;
      font-size: 18px;
      margin-left: 8px;
    }
    .loader-container {
      text-align: center;
      padding: 24px 16px;
      color: #666;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e2e8f0;
      border-top: 3px solid #1E88E5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .back-btn {
      display: block;
      width: 100%;
      height: 44px;
      line-height: 44px;
      background: transparent;
      color: #666;
      text-align: center;
      border: 1px solid #dcdcdc;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      box-sizing: border-box;
      margin-top: 8px;
    }
    .back-btn:active {
      background: #eee;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2 id="headerTitle">Velg telefon</h2>
    <p id="headerSubtitle">Søker etter enheter på lokalnettet...</p>
  </div>

  <!-- Manual IP Input Card -->
  <div class="card">
    <div class="card-title">Skriv inn IP manuelt</div>
    <div class="manual-row">
      <input type="text" id="manualIpInput" placeholder="192.168.68.75" />
      <button class="btn-manual" id="manualAddBtn">Legg til</button>
    </div>
  </div>

  <!-- Discovered Devices Section -->
  <div class="card-title" style="padding: 0 4px;">Funnet på nettverket</div>
  <div id="loader" class="loader-container">
    <div class="spinner"></div>
    <div>Søker etter enheter på nettverket...</div>
  </div>

  <div id="deviceList" class="device-list" style="display: none;"></div>

  <button class="back-btn" id="backBtn">← Tilbake til valg av person</button>

  <script type="application/javascript">
    var currentUser = { userId: 'none', userName: '', firstName: '' };
    var isSubmitting = false;

    // Load selected user from step 1
    Homey.emit('get_selected_user', function(err, user) {
      if (!err && user) {
        currentUser = user;
        if (currentUser.firstName && currentUser.firstName !== 'none') {
          document.getElementById('headerTitle').textContent = 'Velg telefon for ' + currentUser.firstName;
          document.getElementById('headerSubtitle').textContent = 'Trykk på enheten for å knytte den til ' + currentUser.firstName + '.';
        }
      }
    });

    // Scan network for devices
    Homey.emit('scan_network', function(err, devices) {
      document.getElementById('loader').style.display = 'none';
      var listContainer = document.getElementById('deviceList');
      listContainer.style.display = 'flex';

      if (err || !devices || devices.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding:16px; color:#718096; font-size:14px;">Ingen telefoner oppdaget automatisk.<br>Skriv inn IP-adressen i feltet over.</div>';
        return;
      }

      // Render discovered devices
      devices.forEach(function(dev) {
        var item = document.createElement('div');
        item.className = 'device-item';

        var displayName = dev.name || 'Ukjent enhet';
        var lastOctet = dev.ip.split('.').pop();
        if (/^IP\s\./i.test(displayName)) {
          displayName = 'Nettverksenhet .' + lastOctet;
        }

        item.innerHTML =
          '<div class="device-icon">' +
            '<svg viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>' +
          '</div>' +
          '<div class="device-info">' +
            '<div class="device-name">' + escapeHtml(displayName) + '</div>' +
            '<div class="device-ip">IP: ' + escapeHtml(dev.ip) + '</div>' +
          '</div>' +
          '<div class="device-arrow">›</div>';

        item.addEventListener('click', function() {
          createAndAddDevice(dev.ip, dev.hostname);
        });

        listContainer.appendChild(item);
      });
    });

    // Manual IP button
    document.getElementById('manualAddBtn').addEventListener('click', function() {
      var ipInput = document.getElementById('manualIpInput');
      var ip = (ipInput.value || '').trim();
      if (!ip || !/^(\d{1,3}\.){3}\d{1,3}$/.test(ip)) {
        return Homey.alert('Vennligst skriv inn en gyldig IP-adresse (f.eks. 192.168.68.75).');
      }
      createAndAddDevice(ip, '');
    });

    // Back button
    document.getElementById('backBtn').addEventListener('click', function() {
      Homey.prevView();
    });

    function createAndAddDevice(ip, hostname) {
      if (isSubmitting) return;
      isSubmitting = true;

      // Device tile name: Person's first name if selected, otherwise hostname or clean IP
      var tileName = currentUser.firstName;
      if (!tileName || tileName === 'none') {
        tileName = (hostname ? hostname.replace(/\.local$/i, '') : '') || ('Telefon .' + ip.split('.').pop());
      }

      var deviceData = {
        name: tileName,
        data: {
          id: 'phone_' + ip.replace(/[^a-zA-Z0-9]/g, '_') + '_' + Date.now()
        },
        settings: {
          ip: ip,
          hostname: hostname || '',
          homey_user: currentUser.userId || 'none'
        }
      };

      document.getElementById('headerSubtitle').textContent = 'Oppretter enhet "' + tileName + '"...';

      Homey.createDevice(deviceData)
        .then(function() {
          Homey.done();
        })
        .catch(function(err) {
          isSubmitting = false;
          document.getElementById('headerSubtitle').textContent = 'Feil ved opprettelse.';
          Homey.alert(err.message || err);
        });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
